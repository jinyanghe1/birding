name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pillow httpx python-multipart pytest playwright
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: python -m py_compile birdscan/*.py tests/e2e_fixture.py

      - name: Unit tests (全部接口与业务回归)
        run: python -m pytest tests/ -v

      - name: Fixture health check + Playwright E2E
        env:
          BIRDING_API_KEY: dev-key
        run: |
          E2E_DATA="$(mktemp -d "$RUNNER_TEMP/birding-e2e.XXXXXX")"
          SERVER_LOG="$RUNNER_TEMP/birding-e2e-server.log"
          python tests/e2e_fixture.py --data-dir "$E2E_DATA" --port 8765 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          export SERVER_PID
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          # 等待唯一测试服务就绪；若进程提前退出，立即输出日志并失败。
          python - <<'PY' || { cat "$SERVER_LOG"; exit 1; }
          import os
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/api/stats"
          pid = int(os.environ["SERVER_PID"])
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("Fixture server healthy")
                          break
              except OSError:
                  try:
                      os.kill(pid, 0)
                  except ProcessLookupError:
                      raise SystemExit("Fixture server exited before becoming healthy")
                  time.sleep(1)
          else:
              raise SystemExit("Fixture server did not become healthy within 30 seconds")
          PY

          BIRDING_BASE=http://127.0.0.1:8765 BIRDING_TEST_KEY=dev-key \
            python tests/e2e_test.py

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      
      - name: Deploy to server
        run: |
          echo "部署到生产服务器..."
          # 这里可以添加自动部署脚本
          # 目前手动运行 ./scripts/deploy_to_server.sh
