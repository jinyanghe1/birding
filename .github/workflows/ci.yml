name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pillow
      
      - name: Syntax check
        run: |
          python -m py_compile birdscan/*.py
      
      - name: Unit tests
        run: |
          python -m pytest tests/ -v || echo "No tests yet"
      
      - name: Server health check
        run: |
          # 启动测试服务器
          python -m birdscan.cli serve --port 8765 &
          sleep 3
          curl -f http://localhost:8765/api/stats || exit 1
          echo "✅ 服务器健康检查通过"
      
      - name: Playwright E2E tests
        run: |
          pip install playwright
          playwright install chromium
          python tests/e2e_test.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to server
        run: |
          echo "部署到生产服务器..."
          # 这里可以添加自动部署脚本
          # 目前手动运行 ./scripts/deploy_to_server.sh
